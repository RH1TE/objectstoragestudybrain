[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "objectstoragestudybrain"
version = "0.1.0"
description = "Convert study files from Object Storage into searchable Markdown."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "striprtf>=0.0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
studybrain = "study_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/study_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
